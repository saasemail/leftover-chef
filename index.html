<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leftover Chef</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome for social icons -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    integrity="sha512-pO2NfZj9ZP1IvBc8V1r+2I+Ph0HkOpu+RzSTxBvTKBq0WZnnKO8ifl/wfaeRyyQ9eE4xjM20f+G1YwQyjvYlSA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="app-title">
        Leftover Che<img src="chef-hat.png" alt="Chef Hat" class="chef-hat">
      </h1>
      <p class="tagline">
        Got leftovers? Don’t waste them. Leftover Chef gives you instant delicious recipes.
      </p>
    </header>

    <div class="input-area">
      <input
        id="ingredient-input"
        class="ingredient-input"
        type="text"
        placeholder="Add an ingredient (up to 5) and press Enter"
      />
      <button id="get-recipe-btn" class="btn">Get Recipes</button>
      <button id="clear-btn" class="btn btn-secondary">Clear All</button>
    </div>

    <div id="tags" class="tags"></div>
    <div id="results" class="results"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
