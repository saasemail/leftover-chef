<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leftover Chef</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="app-title">Leftover Chef</h1>
      <p class="tagline">Got leftovers? Don’t waste them. Leftover Chef finds recipes using your exact amounts.</p>
    </header>

    <div class="input-area">
      <input
        id="ingredient-input"
        class="ingredient-input"
        type="text"
        placeholder="Type like ‘0.5 tomato’, ‘3 egg’, then press Enter"
      />
      <button id="get-recipe-btn" class="btn">Get Recipes</button>
      <button id="clear-btn" class="btn btn-secondary">Clear All</button>
    </div>

    <div id="tags" class="tags"></div>
    <div id="results" class="results"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
