<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Leftover Chef</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="app-title">Leftover Chef</h1>
      <p class="tagline">Enter your leftovers and get instant recipe suggestions.</p>
    </header>

    <div class="input-area">
      <div class="field">
        <label for="ingredient-name">Ingredient</label>
        <input type="text" id="ingredient-name" placeholder="e.g. tomato">
      </div>
      <div class="field">
        <label for="ingredient-amount">Amount</label>
        <input type="number" id="ingredient-amount" min="0" step="1" placeholder="e.g. 1">
      </div>
      <div class="field">
        <label for="ingredient-unit">Unit</label>
        <select id="ingredient-unit">
          <option value="piece" data-step="1"   data-ph="e.g. 1">piece(s)</option>
          <option value="g"     data-step="1"   data-ph="e.g. 100">grams</option>
          <option value="kg"    data-step="0.1" data-ph="e.g. 0.5">kilograms</option>
          <option value="ml"    data-step="10"  data-ph="e.g. 250">milliliters</option>
          <option value="l"     data-step="0.1" data-ph="e.g. 0.3">liters</option>
        </select>
      </div>
      <button id="add-ingredient-btn" class="btn">Add Ingredient</button>
    </div>

    <div id="tags" class="tags"></div>

    <button id="get-recipes-btn" class="btn primary">Get Recipes</button>
    <button id="clear-btn" class="btn secondary">Clear All</button>

    <div id="results" class="results"></div>
  </div>

  <!-- Inline skripta za dinamičko menjanje step/placeholder -->
  <script>
    const unitSelect = document.getElementById('ingredient-unit');
    const amountInput = document.getElementById('ingredient-amount');

    function updateAmountField() {
      const opt = unitSelect.selectedOptions[0];
      const step = opt.getAttribute('data-step');
      const ph   = opt.getAttribute('data-ph');
      amountInput.step = step;
      amountInput.placeholder = ph;
      // reset vrednost
      amountInput.value = '';
    }

    unitSelect.addEventListener('change', updateAmountField);
    // inicijalno pozovemo jednom
    updateAmountField();
  </script>

  <script src="app.js"></script>
</body>
</html>
